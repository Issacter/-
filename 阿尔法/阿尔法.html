<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿尔法</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto}
.tabs{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative}

/* 箭头按钮样式 */
.swiper-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 80px;
  height: 80px;
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: all 0.3s ease;
  padding: 0;
}

.swiper-arrow:hover {
  transform: translateY(-50%) scale(1.1);
}

.swiper-arrow-left {
  left: 40px;
}

.swiper-arrow-right {
  right: 40px;
}

.swiper-arrow img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: brightness(1.2);
  transition: all 0.3s ease;
}

.swiper-arrow:hover img {
  filter: brightness(1.5);
}

/* 响应式设计 */
@media (max-width: 768px) {
  .swiper-arrow {
    width: 60px;
    height: 60px;
  }
  
  .swiper-arrow-left {
    left: 20px;
  }
  
  .swiper-arrow-right {
    right: 20px;
  }
}
.tabs-viewport{position:relative;flex:1;overflow:hidden}
.swiper{height:100%}
.swiper-wrapper{height:100%}
.swiper-slide{width:100%;height:100%;position:relative}

/* 为卡片添加3D效果 */
.panel-card{
  transform-style:preserve-3d;
}
.panel{flex:0 0 100%;height:100%;position:relative;display:flex;align-items:stretch;justify-content:stretch;background:#000}
.panel-card{width:100%;height:100%;border-radius:0;background-image:none;background-size:cover;background-repeat:no-repeat;background-position:center;display:flex;align-items:flex-end;justify-content:flex-start;padding:24px}
.panel-title{font-size:22px;margin:0}
.panel.panel-video .card-front{
  background-image: none !important;
  background-size: initial !important;
  background-position: initial !important;
  background-repeat: initial !important;
  background-color: #000;
}
.panel.panel-gallery .card-front{
  background-image: none !important;
  background-size: initial !important;
  background-position: initial !important;
  background-repeat: initial !important;
  background-color: #000;
}
.flippable-card{position:relative;background:none;padding:0;perspective:1000px}
.flippable-card .card-inner{position:absolute;inset:0;transition:transform 1.6s;transform-style:preserve-3d}
.flippable-card.is-flipped .card-inner{transform:rotateY(180deg)}
.flippable-card .card-face{position:absolute;inset:0;backface-visibility:hidden}
.flippable-card .card-front{background-image:none;background-size:initial;background-position:initial}
.flippable-card .card-back{background:#05070d;padding:32px;transform:rotateY(180deg)}
.flippable-card .panel-title{position:absolute;left:24px;bottom:24px;margin:0}
.card-face.card-back{border-radius:0;display:flex;flex-direction:column;overflow:hidden}

/* 顶部导航栏样式 */
.top-navigation {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 10px 20px;
  background: transparent;
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

/* 菜单按钮样式 */
.menu-button {
  display: flex;
  align-items: center;
  gap: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.menu-button svg {
  width: 44px;
  height: 25px;
  transition: transform 0.3s ease;
}

.menu-button:hover svg {
  transform: scale(1.1);
}

/* 标题样式 */
.nav-title {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-title::before {
  content: "✦";
  color: #ff0f7b;
  font-size: 20px;
}

/* 管理标签样式 */
.management-tabs {
  display: flex;
  gap: 15px;
  transition: all 0.3s ease;
}

.management-tabs.collapsed {
  display: none;
}

.management-tab {
  padding: 8px 20px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(5px);
}

.management-tab:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

.management-tab.active {
  background: rgba(255, 15, 123, 0.6);
  border-color: rgba(255, 15, 123, 0.8);
}
.glass-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:100%}
.glass-column{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:20px;display:flex;flex-direction:column;backdrop-filter:blur(12px)}
.glass-column.skin-column{padding:0;position:relative;overflow:hidden;margin:0;background:transparent;border:1px solid rgba(255,255,255,0.08);backdrop-filter:none;height:100%}
.glass-column.skin-column .glass-column-title{position:absolute;left:12px;top:12px;z-index:12;margin:0;padding:6px 10px;background:rgba(0,0,0,0.25);border-radius:8px}
.glass-column.fanart-column{background:transparent;border:1px solid rgba(255,255,255,0.08);backdrop-filter:none}
.glass-column-title{margin:0;font-size:18px;letter-spacing:4px;text-transform:uppercase;color:#e4e8ff;font-weight:600}
.glass-track{flex:1;position:relative;display:flex;align-items:center;gap:0;margin-top:16px;overflow-x:auto;padding:12px 0;scroll-snap-type:x mandatory}
.glass-track::-webkit-scrollbar{height:6px;background:transparent}
.glass-track::-webkit-scrollbar-thumb{background:#37ff8b;border-radius:999px}
.glass-track .glass{position:relative;width:200px;height:190px;background:linear-gradient(#fff2,transparent);border:1px solid rgba(255,255,255,0.1);box-shadow:0 25px 25px rgba(0,0,0,0.25);display:flex;justify-content:center;align-items:center;transition:.5s;border-radius:16px;margin:0 -45px;backdrop-filter:blur(10px);transform:rotate(calc(var(--r,0)*1deg));overflow:hidden;scroll-snap-align:center}
.glass-track .glass img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.glass-track .glass::before{display:none}
.glass-track:hover .glass{transform:rotate(0deg);margin:0 12px}

/* 精简后的涂装轨道样式：规整排列，hover 扩展，图片填满 */
.glass-track.skin-track{
  display:flex;align-items:stretch;gap:0;margin-top:0;overflow-x:auto;padding:0;scroll-snap-type:x mandatory;
}
.glass-track.skin-track .glass{
  flex:1 1 0%;min-width:0;height:380px;background:#212121;border:1.5px solid #ff5a91;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:flex .5s,box-shadow .35s,border .35s;margin:0;box-shadow:0 8px 32px rgba(0,0,0,0.18);overflow:hidden;scroll-snap-align:center;padding:0;
}
.glass-track.skin-track .glass:hover{flex:4 1 0%;z-index:10;box-shadow:0 12px 40px 0 #ff5a9133,0 2px 8px #0008;border:2.5px solid #ff5a91}
.glass-track.skin-track .glass img{width:100%;height:100%;object-fit:cover;border-radius:2px;transition:none}
/* 变体尺寸（按需使用） */
.icon-container .glass.small{width:140px;height:160px;border-radius:8px}
.icon-container .glass.medium{width:180px;height:200px}
.icon-container .glass.large{width:220px;height:240px}
/* 基于你提供的 React Card 风格：横向可扩展的涂装展示 */
.skin-card{width:100%;height:100%;border-radius:0;background:transparent;display:flex;gap:0;padding:0;margin:0;position:relative}
.skin-card p{height:100%;flex:1;overflow:hidden;cursor:pointer;border-radius:0;transition:all .5s;background:transparent;border:0;display:block;position:relative;margin:0;padding:0;top:0;left:0}
.skin-card p:hover{flex:4}
.skin-card p img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0}
/* 卡面视频样式：铺满并禁止直接交互（点击由容器处理） */
.card-front{position:relative;overflow:hidden}
.card-front video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card-front .video-placeholder{position:absolute;inset:0;display:none}

/* 图片查看器样式 */
.image-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#000e;z-index:999999;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease;pointer-events:none;overflow:hidden}
  .image-viewer.show{opacity:1;pointer-events:all}
  /* 修改为完整显示图片，设置最大宽度和高度以适应屏幕 */
  .image-viewer .fv-img{position:relative;object-fit:contain;transition:opacity .3s ease;max-width:90%;max-height:90%;width:auto;height:auto}
.image-viewer .fv-close{position:absolute;top:20px;right:20px;width:40px;height:40px;background:#000c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;cursor:pointer;z-index:1000000;transition:background-color .3s ease}
.image-viewer .fv-close:hover{background:#000f}

/* Vue卡片样式 */
.card {
  position: relative;
  width: 100%;
  height: 100%;
  background: linear-gradient(-45deg, #f89b29 0%, #ff0f7b 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

.card__image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  z-index: 2;
}

.card:hover {
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}

.card:hover .card__image {
  opacity: 0;
  transform: scale(0.9);
}

.card__content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  height: 100%;
  padding: 24px;
  box-sizing: border-box;
  background-color: #fff;
  opacity: 0;
  transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  text-align: left;
  overflow-y: auto;
  border-radius: 10px;
}

/* 美化滚动条 */
.card__content::-webkit-scrollbar {
  width: 6px;
}

.card__content::-webkit-scrollbar-track {
  background: #f1f1f1;
  border-radius: 3px;
}

.card__content::-webkit-scrollbar-thumb {
  background: #888;
  border-radius: 3px;
}

.card__content::-webkit-scrollbar-thumb:hover {
  background: #555;
}

.card:hover .card__content {
  opacity: 1;
}

.card__title {
  margin: 0 0 16px 0;
  font-size: 28px;
  color: #2c3e50;
  font-weight: 800;
  text-align: center;
  width: 100%;
  border-bottom: 2px solid #ff0f7b;
  padding-bottom: 12px;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
}

.card__description {
  margin: 0;
  font-size: 15px;
  color: #34495e;
  line-height: 1.8;
  letter-spacing: 0.5px;
  text-align: justify;
  white-space: pre-line;
  overflow-wrap: break-word;
}

/* 为简介文本添加段落样式 */
.card__description p {
  margin: 0 0 12px 0;
}

/* 为简介中的小标题添加样式 */
.card__description strong {
  color: #ff0f7b;
  font-weight: 700;
}

/* 为简介中的列表项添加样式 */
.card__description li {
  margin: 8px 0;
  padding-left: 8px;
}

/* 确保内容区域在不同屏幕尺寸下都有良好的显示效果 */
@media (max-width: 768px) {
  .card__content {
    padding: 16px;
  }
  
  .card__title {
    font-size: 24px;
  }
  
  .card__description {
    font-size: 14px;
    line-height: 1.6;
  }
}

/* 角色立绘卡片样式 */
.role-avatar-container .card {
  width: 100%;
  height: 100%;
}
</style>

<script>
const swiper=new Swiper('#swiper',{initialSlide:0,speed:500,effect:'slide',centeredSlides:true,slidesPerView:1,grabCursor:true})
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')swiper.slidePrev();if(e.key==='ArrowRight')swiper.slideNext()})

// 添加箭头按钮点击事件
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

prevBtn.addEventListener('click', () => {
  swiper.slidePrev();
});

nextBtn.addEventListener('click', () => {
  swiper.slideNext();
});

// 添加鼠标跟随效果
const tabsElement = document.getElementById('tabs');
const swiperElement = document.getElementById('swiper');

// 为卡片添加3D悬浮效果
function add3DFloatEffect() {
  let isMoving = false;
  
  tabsElement.addEventListener('mousemove', (e) => {
    if (isMoving) return;
    isMoving = true;
    
    // 计算鼠标在视口中的位置
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    // 获取视口尺寸
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    
    // 计算偏移量和旋转角度
    // 平移范围：-15 到 15px
    const offsetX = ((mouseX / viewportWidth) - 0.5) * 30;
    const offsetY = ((mouseY / viewportHeight) - 0.5) * 30;
    // 旋转范围：-5 到 5度
    const rotateY = ((mouseX / viewportWidth) - 0.5) * 10;
    const rotateX = -((mouseY / viewportHeight) - 0.5) * 10;
    
    // 应用3D效果到当前激活的卡片，但只在未翻转状态下
    const activeSlide = swiperElement.querySelector('.swiper-slide-active');
    if (activeSlide) {
      const flippableCard = activeSlide.querySelector('.flippable-card');
      const panelCard = activeSlide.querySelector('.panel-card');
      if (panelCard && !flippableCard.classList.contains('is-flipped')) {
        panelCard.style.transition = 'transform 0.3s ease-out';
        panelCard.style.transform = `translate(${offsetX}px, ${offsetY}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }
    }
    
    setTimeout(() => {
      isMoving = false;
    }, 100);
  });
  
  // 鼠标离开时重置卡片位置
  tabsElement.addEventListener('mouseleave', () => {
    const activeSlide = swiperElement.querySelector('.swiper-slide-active');
    if (activeSlide) {
      const panelCard = activeSlide.querySelector('.panel-card');
      if (panelCard) {
        panelCard.style.transition = 'transform 0.5s ease-out';
        panelCard.style.transform = 'translate(0, 0) rotateX(0deg) rotateY(0deg)';
      }
    }
  });
  
  // 卡片切换时重置位置
  swiper.on('slideChange', () => {
    const slides = swiperElement.querySelectorAll('.swiper-slide');
    slides.forEach(slide => {

// Helper: smooth scroll track so the clicked glass is centered, then open viewer
function scrollToCenterThenOpen(imgEl){
  const track = imgEl.closest('.glass-track'); if(!track){ openImageViewer(imgEl); return; }
  const tr = track.getBoundingClientRect();
  const gr = imgEl.closest('.glass').getBoundingClientRect();
  const offset = (gr.left + gr.width/2) - (tr.left + tr.width/2);
  // perform smooth scroll
  try{ track.scrollBy({left: offset, behavior: 'smooth'}); }catch(e){ track.scrollLeft += offset; }
  // wait for scroll to settle (based on distance) then open viewer from the new position
  const waitMs = Math.min(700, Math.max(220, Math.abs(offset) * 0.6));
  setTimeout(()=> openImageViewer(imgEl), waitMs);
}

<script>
// 中间卡片放大逻辑：在每个 .glass-track 中检测中心最近的 .glass，并添加 .is-center
(function(){
  function updateCenters(){
    document.querySelectorAll('.glass-track').forEach(track=>{
      const trackRect = track.getBoundingClientRect();
      const centerX = trackRect.left + trackRect.width / 2;
      let closest = null; let minDist = Infinity;
      Array.from(track.querySelectorAll('.glass')).forEach(g=>{
        const r = g.getBoundingClientRect();
        const gx = r.left + r.width/2;
        const dist = Math.abs(gx - centerX);
        if(dist < minDist){ minDist = dist; closest = g }
      });
      track.querySelectorAll('.glass').forEach(g=> g.classList.toggle('is-center', g === closest));
    });
  }

  let raf = null;
  document.querySelectorAll('.glass-track').forEach(track=>{
    track.addEventListener('scroll', ()=>{ if(raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(updateCenters); });
    // 点击某个 glass 时，平滑滚动使其居中（可选交互）
    track.addEventListener('click', e=>{
      const g = e.target.closest('.glass');
      if(!g) return;
      const tr = track.getBoundingClientRect();
      const gr = g.getBoundingClientRect();
      const offset = (gr.left + gr.width/2) - (tr.left + tr.width/2);
      track.scrollBy({left: offset, behavior: 'smooth'});
    });
  });

  window.addEventListener('resize', ()=>{ if(raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(updateCenters); });
  document.addEventListener('DOMContentLoaded', ()=>{ updateCenters(); });
  // 也在脚本执行时初始化一次（文件可能已加载）
  setTimeout(updateCenters, 120);
})();
</script>
<script>
// 全屏查看器（FLIP 风格动画）
// viewer 配置（可调）
const viewerConfig = {
  revertOnClose: false, // true = shrink back to origin; false = fade overlay
  animationDuration: 320, // ms for image transitions
  scrollWaitBase: 360, // ms baseline wait after scroll before opening
  swipeThreshold: 50
};

function openImageViewer(imgEl){
  if(document.querySelector('.image-viewer')) return;
  const track = imgEl.closest('.glass-track');
  const images = track ? Array.from(track.querySelectorAll('.glass img')) : [imgEl];
  let currentIndex = imgEl.closest('.glass') ? parseInt(imgEl.closest('.glass').dataset.index || 0) : 0;

  const body = document.body;
  const overlay = document.createElement('div'); overlay.className='image-viewer';
  const closeBtn = document.createElement('div'); closeBtn.className='fv-close'; closeBtn.innerHTML='✕'; overlay.appendChild(closeBtn);
  // initial clone (will be replaced on nav)
  const clone = document.createElement('img'); clone.className='fv-img'; clone.src = images[currentIndex].src;
  overlay.appendChild(clone);
  document.documentElement.appendChild(overlay);
  const prevOverflow = body.style.overflow; body.style.overflow='hidden';

  // apply transition durations
  clone.style.transition = `all ${viewerConfig.animationDuration}ms ease`;

  // animate from source position (FLIP start)
  const startRect = images[currentIndex].getBoundingClientRect();
  clone.style.left = startRect.left + 'px'; clone.style.top = startRect.top + 'px';
  clone.style.width = startRect.width + 'px'; clone.style.height = startRect.height + 'px';
  clone.style.borderRadius = window.getComputedStyle(images[currentIndex]).borderRadius || '8px';

  requestAnimationFrame(()=>{
    overlay.classList.add('show');
    // 移除所有强制尺寸和位置设置，让CSS控制图片的缩放和居中
    clone.style.borderRadius = '6px';
    clone.style.objectFit = 'contain'; // 保持图片比例
    // 移除所有可能干扰CSS缩放的位置和尺寸设置
    clone.style.left = '';
    clone.style.top = '';
    clone.style.width = '';
    clone.style.height = '';
  });

  // navigation helpers
  function showIndex(newIndex, direction){
    if(newIndex < 0 || newIndex >= images.length) return;
    const nextImg = document.createElement('img'); nextImg.className = 'fv-img'; nextImg.src = images[newIndex].src;
    nextImg.style.opacity = 0; 
    nextImg.style.borderRadius = '6px';
    nextImg.style.transition = `opacity ${viewerConfig.animationDuration}ms ease`;
    // 不设置位置和尺寸，让CSS控制缩放和居中
    overlay.appendChild(nextImg);
    requestAnimationFrame(()=> nextImg.style.opacity = 1);
    // remove previous clone after fade
    setTimeout(()=>{ if(clone.parentNode) clone.parentNode.removeChild(clone); }, viewerConfig.animationDuration);
    // replace reference
    clone.src = nextImg.src; // reuse reference for subsequent ops
    if(nextImg.parentNode) nextImg.parentNode.removeChild(nextImg);
    currentIndex = newIndex;
  }

  // swipe handling
  let touchX = null; let touchLocked = false;
  overlay.addEventListener('touchstart', e=>{ if(e.touches && e.touches[0]) touchX = e.touches[0].clientX; }, {passive:true});
  overlay.addEventListener('touchmove', e=>{ if(!touchX || touchLocked) return; const dx = e.touches[0].clientX - touchX; if(Math.abs(dx) > viewerConfig.swipeThreshold){ touchLocked = true; if(dx < 0) showIndex(currentIndex+1, 'left'); else showIndex(currentIndex-1, 'right'); setTimeout(()=>{ touchLocked=false; touchX=null; }, 300); } }, {passive:true});

  function onKey(e){ if(e.key==='Escape') close(); if(e.key==='ArrowRight') showIndex(currentIndex+1); if(e.key==='ArrowLeft') showIndex(currentIndex-1); }

  function close(){
    document.removeEventListener('keydown', onKey);
    if(viewerConfig.revertOnClose){
      // animate back to original element position
      const srcEl = images[currentIndex];
      const rect2 = srcEl.getBoundingClientRect();
      clone.style.left = rect2.left + 'px'; clone.style.top = rect2.top + 'px';
      clone.style.width = rect2.width + 'px'; clone.style.height = rect2.height + 'px';
      overlay.classList.remove('show');
      clone.addEventListener('transitionend', ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); body.style.overflow = prevOverflow || ''; }, {once:true});
    } else {
      // fade out overlay (or shrink inside the column if it was a skin target)
      // apply a gentle fade to the overlay and remove the clone immediately
      overlay.classList.remove('show');
      const onEnd = ()=>{ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); body.style.overflow = prevOverflow || ''; overlay.removeEventListener('transitionend', onEnd); };
      overlay.addEventListener('transitionend', onEnd);
    }
  }

  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
}
</script>

<!-- 自动插入卡面视频（静音自动播放、不可交互；点击卡面暂停视频） -->
<script>
  (function(){
    const map = [
      {selector: '.panel.panel-video .card-front', src: '红莲/卡面.mp4'},
      {selector: '.panel.panel-audio .card-front', src: '深红囚影/卡面.mp4'},
      {selector: '.panel.panel-gallery .card-front', src: '深红之渊/卡面.mp4'}
    ];

    map.forEach(item=>{
      const el = document.querySelector(item.selector);
      if(!el) return;
      // 如果已有 video，跳过
      if(el.querySelector('video')) return;

      const video = document.createElement('video');
      video.src = item.src;
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.loop = true;
      video.preload = 'auto';
      video.controls = false;
      video.tabIndex = -1;
      video.setAttribute('aria-hidden','true');
      video.style.pointerEvents = 'none';
      video.addEventListener('contextmenu', e=>e.preventDefault());

      // insert as first child so it sits behind UI elements if any
      el.insertBefore(video, el.firstChild);

      // try to play (some browsers require user gesture unless muted)
      video.play().catch(()=>{});

      // 点击卡面暂停视频（仅执行暂停，不提供恢复）
      el.addEventListener('click', ()=>{
        try{ if(!video.paused) video.pause(); }catch(e){}
      });
    });
  })();
</script>
