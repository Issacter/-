<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Music Player UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-color: #0f1014; --accent-color: #ff3e3e; --text-main: #ffffff;
    --text-sub: #888888; --line-color: #333333; --skew-deg: -15deg; --sidebar-width: 250px;
}
*
{ margin: 0; padding: 0; box-sizing: border-box; }
body {
    background-color: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif;
    overflow: hidden; height: 100vh; width: 100vw; display: flex;
    background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
}

/* 左侧侧边栏 (隐藏/滑出) */
.sidebar {
    position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh;
    padding: 40px 20px; display: flex; flex-direction: column; gap: 20px; z-index: 100;
    background: linear-gradient(90deg, var(--bg-color) 0%, rgba(15,16,20,0.8) 100%);
    border-right: 1px solid var(--line-color);
    transform: translateX(calc(var(--sidebar-width) * -1));
    transition: transform 0.3s ease-out;
}
.sidebar.open { transform: translateX(0); }
.menu-item {
    color: var(--text-sub); text-transform: uppercase; font-weight: 600; cursor: pointer;
    padding: 10px; transition: 0.3s; display: flex; align-items: center; border-left: 3px solid transparent;
}
.menu-item:hover { color: var(--text-main); }
.menu-item.active {
    color: var(--accent-color); border-left: 3px solid var(--accent-color); padding-left: 15px;
    text-shadow: 0 0 8px rgba(255, 62, 62, 0.5);
}

/* 主体内容 */
.main-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
.hero-section {
    position: absolute; left: -50px; width: 65%; height: 100%; background: #1a1b20;
    transform: skewX(var(--skew-deg)); overflow: hidden; border-right: 2px solid var(--accent-color); z-index: 1;
}

/* --- 核心修改 1: 封面适配优化 --- */
.hero-img {
    width: 100%; /* 修正宽度，使其适应 .hero-section */
    height: 100%;
    object-fit: cover;
    /* 修正斜切/位移以保持图片比例和覆盖 */
    transform: skewX(15deg) translateX(0);
    opacity: 1; /* 提高不透明度，让图片更清晰 */
    background: center/cover no-repeat;
    /* 降低遮罩透明度，露出更多图片 */
    mask-image: linear-gradient(to right, black 80%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, black 80%, transparent 100%);
    transition: background-image 0.5s ease, opacity 0.3s;
    position: relative;
}
/* 封面模式下，图片完全可见 */
.lyrics-display:not(.active) + .hero-img { opacity: 1; }

/* 歌词显示区域 */
.lyrics-display {
    position: absolute; bottom: 50%; left: 150px; width: 500px; height: 300px;
    transform: skewX(15deg) translateY(50%); z-index: 3; overflow-y: scroll; padding-right: 20px;
    line-height: 1.8; opacity: 0; transition: opacity 0.5s ease;
    scrollbar-width: none; -ms-overflow-style: none;
    
    /* --- 核心修改 2: 歌词模式背景与文字样式 --- */
    background-color: rgba(15, 16, 20, 0.9); /* 半透明背景，保证歌词可读性 */
    border: 1px solid var(--accent-color);
    box-shadow: 0 0 20px rgba(255, 62, 62, 0.4);
}
.lyrics-display.active { opacity: 1; }
.lyrics-display p {
    margin: 15px 0; font-size: 1.2rem; color: var(--text-sub);
    transition: color 0.3s ease, font-size 0.3s ease;
}
.lyrics-display p.highlight {
    color: var(--text-main); font-size: 1.5rem; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* 隐藏封面上的文字信息，改为在歌词/封面模式下保持显示在下方 */
.hero-info {
    position: absolute; bottom: 100px; left: 150px; transform: skewX(15deg); z-index: 5;
    color: var(--text-main);
}
.hero-title { font-size: 3rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 5px; }
.hero-subtitle { font-size: 1.2rem; color: var(--accent-color); text-transform: uppercase; letter-spacing: 4px; }


/* 播放器控制条 (位置不变，保持在信息下方) */
.player-controls {
    position: absolute; bottom: 25%; left: 150px; width: 500px; transform: skewX(15deg); z-index: 5;
}

/* 播放列表 (保持不变) */
.playlist-container {
    position: absolute; right: 0; top: 0; width: 40%; height: 100%; z-index: 5; overflow: hidden; pointer-events: none;
}
/* ... 播放列表其余样式保持不变 ... */
.track-item {
    position: absolute; right: 0; top: 50%; width: 100%; display: flex; align-items: center; justify-content: flex-end;
    padding-right: 60px; cursor: pointer; transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    pointer-events: auto; transform-origin: center right;
}
.track-item.active .node {
    border-color: var(--accent-color); background: rgba(255, 62, 62, 0.1); box-shadow: 0 0 15px var(--accent-color);
    transform: scale(1.2);
}
.visualizer {
    position: absolute; right: 15px; display: flex; gap: 3px; height: 20px; align-items: center; opacity: 0; transition: 0.3s;
}
.track-item.active .visualizer { opacity: 1; }
@keyframes bounce { 0%, 100% { height: 2px; } 50% { height: 15px; } }




        /* 播放器控制条 */
        .player-controls {
            position: absolute;
            bottom: 25%;
            left: 150px;
            width: 500px;
            transform: skewX(15deg);
            z-index: 5;
        }
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.2);
            margin: 15px 0;
            position: relative;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--text-main);
            position: relative;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            transform: rotate(45deg);
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-family: monospace;
            color: var(--text-sub);
        }
        .control-btns {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 5px 15px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .btn:hover { background: var(--accent-color); border-color: var(--accent-color); color: black; }

        /* 右侧播放列表 (弧形) */
        .playlist-container {
            position: absolute;
            right: 0;
            top: 0;
            width: 40%;
            height: 100%;
            z-index: 5;
            overflow: hidden;
            pointer-events: none;
        }
        .track-item {
            position: absolute;
            right: 0;
            top: 50%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            pointer-events: auto;
            transform-origin: center right;
        }
        .node {
            width: 30px;
            height: 30px;
            border: 2px solid var(--text-sub);
            border-radius: 50%;
            flex-shrink: 0;
            margin-right: 20px;
            position: relative;
            background: var(--bg-color);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .track-item.active .node {
            border-color: var(--accent-color);
            background: rgba(255, 62, 62, 0.1);
            box-shadow: 0 0 15px var(--accent-color);
            transform: scale(1.2);
        }
        .track-item.active .node::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
        }
        .track-details {
            text-align: right;
            margin-right: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            transform: skewX(-15deg);
        }
        .track-item.active .track-details { opacity: 1; }
        .track-details h3 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .track-details p {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .visualizer {
            position: absolute;
            right: 15px;
            display: flex;
            gap: 3px;
            height: 20px;
            align-items: center;
            opacity: 0;
            transition: 0.3s;
        }
        .track-item.active .visualizer { opacity: 1; }
        .bar { width: 3px; background: var(--accent-color); animation: bounce 0.8s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { height: 2px; } 50% { height: 15px; } }
    </style>
</head>
<body>

    <!-- 使用通用背景音乐脚本 -->
    <script src="../通用脚本/background-music.js"></script>

    <div class="sidebar" id="sidebar">
        <div class="header-deco" style="transform: none; position: relative; top: 0; margin-bottom: 50px;">
            <h1>PUNISHING</h1>
            <span>GRAY RAVEN MUSIC</span>
        </div>
        <div class="menu-item active" id="btn-cover"><span style="font-size: 1.5rem;"> 封面</span></div>
        <div class="menu-item" id="btn-back"><span style="font-size: 1.5rem;">返回</span></div>
    </div>
    
    <div class="main-container">

        <div class="hero-section">
            <div class="hero-img" id="hero-img"></div>

            <div class="hero-info" style="transform: skewX(15deg); position: absolute; bottom: 40%; left: 150px; z-index: 2;">
                <h2 class="hero-title" id="current-title">Loading...</h2>
                <p class="hero-subtitle" id="current-artist"></p>
            </div>
        </div>

        <div class="player-controls">
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display">
                <span id="current-time">00:00</span>
                <span id="duration">00:00</span>
            </div>
            <div class="control-btns">
                <button class="btn" id="prev-btn">Prev</button>
                <button class="btn" id="play-btn">PLAY</button>
                <button class="btn" id="next-btn">Next</button>
            </div>
        </div>
        
        <div class="playlist-container" id="playlist"></div>
    </div>

<script>
// 歌曲数据 (请确保路径和LRC文件存在)
const tracks = [
    { title: "夤夜渡（「九龙夜航」概念曲）", artist: "战双帕弥什,Anti-General", duration: "04:32", src: "素材/音频/战双帕弥什,Anti-General - 夤夜渡（「九龙夜航」概念曲）.m4a", cover: "素材/歌曲封面/战双帕弥什,Anti-General - 夤夜渡（「九龙夜航」概念曲）.jpg" },
    { title: "鸣响", artist: "战双帕弥什,Vanguard Sound,Kinoko蘑菇", duration: "03:45", src: "素材/音频/战双帕弥什,Vanguard Sound,Kinoko蘑菇 - 鸣响.m4a", cover: "素材/歌曲封面/战双帕弥什,Vanguard Sound,Kinoko蘑菇 - 鸣响.jpg" },
    { title: "I Always Do", artist: "战双帕弥什,九渊,DALCEXY", duration: "03:30", src: "素材/音频/战双帕弥什,九渊,DALCEXY - I Always Do.m4a", cover: "素材/歌曲封面/战双帕弥什,九渊,DALCEXY - I Always Do.jpg" },
    { title: "Hikari", artist: "战双帕弥什,GhostFinal,Vanguard Sound", duration: "03:52", src: "素材/音频/战双帕弥什,GhostFinal,Vanguard Sound - Hikari.m4a", cover: "素材/歌曲封面/战双帕弥什,GhostFinal,Vanguard Sound - Hikari.jpg" },
    { title: "她的梦", artist: "战双帕弥什,Sawako碎花", duration: "03:18", src: "素材/音频/战双帕弥什,Sawako碎花 - 她的梦.m4a", cover: "素材/歌曲封面/战双帕弥什,Sawako碎花 - 她的梦.jpeg" },
    { title: "Under Dimension", artist: "战双帕弥什,Kinoko蘑菇", duration: "03:48", src: "素材/音频/战双帕弥什,Kinoko蘑菇 - Under Dimension.m4a", cover: "素材/歌曲封面/战双帕弥什,Kinoko蘑菇 - Under Dimension.jpg" },
    { title: "寻找四叶草的阿呆蛙", artist: "战双帕弥什,Sawako碎花", duration: "02:55", src: "素材/音频/战双帕弥什,Sawako碎花 - 寻找四叶草的阿呆蛙.m4a", cover: "素材/歌曲封面/战双帕弥什,Sawako碎花 - 寻找四叶草的阿呆蛙.jpg" },
    { title: "LAMIA-part3", artist: "战双帕弥什,Vanguard Sound", duration: "03:12", src: "素材/音频/战双帕弥什,Vanguard Sound - LAMIA-part3.m4a", cover: "素材/歌曲封面/战双帕弥什,Vanguard Sound - LAMIA-part3.jpg" },
    { title: "夏日之上", artist: "战双帕弥什,熊子,ANK", duration: "03:24", src: "素材/音频/战双帕弥什,熊子,ANK - 夏日之上.m4a", cover: "素材/歌曲封面/战双帕弥什,熊子,ANK - 夏日之上.jpg" },
    { title: "Passion Call（热烈独白）", artist: "战双帕弥什,花玲", duration: "03:15", src: "素材/音频/战双帕弥什,花玲 - Passion Call（热烈独白）.m4a", cover: "素材/歌曲封面/战双帕弥什,花玲 - Passion Call（热烈独白）.jpg" },
    { title: "Burning Vow 誓焰", artist: "芝麻Mochi", duration: "03:58", src: "素材/音频/芝麻Mochi - Burning Vow 誓焰.m4a", cover: "素材/歌曲封面/芝麻Mochi - Burning Vow 誓焰.jpg" },
    { title: "Elegy Of Fate 遗光颂（剧情曲）", artist: "战双帕弥什,S9ryne", duration: "03:42", src: "素材/音频/战双帕弥什,S9ryne - Elegy Of Fate 遗光颂（剧情曲）.m4a", cover: "素材/歌曲封面/战双帕弥什,S9ryne - Elegy Of Fate 遗光颂（剧情曲）.jpg" }
];

let currentTrackIndex = 0, isPlaying = false, isScrolling = false;

// 使用全局的backgroundMusic实例
let audio;
const playBtn = document.getElementById('play-btn');
const currentTitle = document.getElementById('current-title');
const heroImg = document.getElementById('hero-img');
const sidebar = document.getElementById('sidebar');
const btnCover = document.getElementById('btn-cover');
const btnBack = document.getElementById('btn-back');
const progressContainer = document.getElementById('progress-container');
const progressBar = document.getElementById('progress-bar');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const playlistEl = document.getElementById('playlist');
const currentArtist = document.getElementById('current-artist');

// 等待backgroundMusic加载完成
function waitForBackgroundMusic() {
    if (window.backgroundMusic) {
        audio = window.backgroundMusic.audio;
        updateUI();
        initEventListeners();
    } else {
        setTimeout(waitForBackgroundMusic, 100);
    }
}

// 弧形列表计算 (保持不变)
function renderPlaylistPositions() {
    const items = document.querySelectorAll('.track-item');
    const spacing = 80;
    items.forEach((item, index) => {
        const offset = index - currentTrackIndex;
        if (Math.abs(offset) > 6) { item.style.opacity = 0; item.style.pointerEvents = 'none'; return; }
        const translateY = offset * spacing;
        const translateX = Math.pow(offset, 2) * 15;
        const scale = 1 - Math.abs(offset) * 0.15;
        const opacity = 1 - Math.abs(offset) * 0.3;
        const rotate = offset * 5;
        item.style.transform = `translate(${translateX}px, calc(-50% + ${translateY}px)) scale(${Math.max(0, scale)}) rotate(${rotate}deg)`;
        item.style.opacity = Math.max(0, opacity);
        item.style.zIndex = 100 - Math.abs(offset);
        item.classList.toggle('active', index === currentTrackIndex);
        item.style.pointerEvents = index === currentTrackIndex ? 'auto' : 'auto';
    });
}

// 初始化播放列表 DOM (保持不变)
function initPlaylistDOM() {
    playlistEl.innerHTML = '';
    tracks.forEach((track, index) => {
        const item = document.createElement('div');
        item.classList.add('track-item');
        item.dataset.index = index;
        const bars = Array(4).fill(0).map((_, i) => 
            `<div class="bar" style="animation-delay: ${Math.random()}s; height: ${5 + Math.random()*10}px"></div>` 
        ).join('');
        item.innerHTML = `<div class="track-details"><h3>${track.title}</h3><p>${track.artist}</p></div><div class="node"></div><div class="visualizer">${bars}</div>`;
        item.addEventListener('click', () => { if (currentTrackIndex !== index) { loadTrack(index); playTrack(); } });
        playlistEl.appendChild(item);
    });
}

// 更新UI以反映当前音频状态
function updateUI() {
    if (window.backgroundMusic) {
        const state = window.backgroundMusic.getPlaybackState();
        currentTrackIndex = state.currentTrackIndex;
        isPlaying = state.isPlaying;
        
        // 更新播放按钮
        playBtn.innerText = isPlaying ? 'PAUSE' : 'PLAY';
        
        // 更新歌曲信息
        const track = tracks[currentTrackIndex];
        if (track) {
            currentTitle.innerText = track.title;
            currentArtist.innerText = track.artist;
            durationEl.innerText = track.duration;
            
            // **同步背景图片**
            const coverUrl = `url('${track.cover}')`;
            heroImg.style.backgroundImage = coverUrl;
            
            // **网页背景联动**
            document.body.style.backgroundImage = coverUrl;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
            document.body.style.backgroundRepeat = 'no-repeat';
            // 添加模糊效果，确保文字可读性
            document.body.style.backdropFilter = 'blur(10px)';
        }
        
        renderPlaylistPositions();
    }
}

// 加载歌曲 (同步封面和背景)
function loadTrack(index) {
    if (window.backgroundMusic) {
        window.backgroundMusic.loadTrack(index);
        updateUI();
    }
}

// 播放/暂停控制
function playTrack() {
    if (window.backgroundMusic) {
        window.backgroundMusic.playTrack();
        updateUI();
    }
}

function pauseTrack() {
    if (window.backgroundMusic) {
        window.backgroundMusic.pauseTrack();
        updateUI();
    }
}

// 初始化事件监听器
function initEventListeners() {
    // 侧边栏功能 (保持不变)
    document.querySelector('body').addEventListener('mousemove', (e) => {
        if (e.clientX < 30) sidebar.classList.add('open');
    });
    sidebar.addEventListener('mouseleave', () => { sidebar.classList.remove('open'); });
    
    // 封面/返回按钮功能 (保持不变)
    btnCover.addEventListener('click', () => { /* 封面功能，保持不变 */ });
    btnBack.addEventListener('click', () => { window.location.href = '../导航/index.html'; });
    
    // 播放控制
    playBtn.addEventListener('click', () => {
        if (window.backgroundMusic) {
            if (isPlaying) {
                window.backgroundMusic.pauseTrack();
            } else {
                window.backgroundMusic.playTrack();
            }
            updateUI();
        }
    });
    
    // 上一首/下一首控制
    document.getElementById('prev-btn').addEventListener('click', () => {
        if (window.backgroundMusic) {
            window.backgroundMusic.prevTrack();
            updateUI();
        }
    });
    
    document.getElementById('next-btn').addEventListener('click', () => {
        if (window.backgroundMusic) {
            window.backgroundMusic.nextTrack();
            updateUI();
        }
    });
    
    // 进度条更新
    audio.addEventListener('timeupdate', (e) => {
        const { duration, currentTime } = e.srcElement;
        progressBar.style.width = `${(currentTime / duration) * 100}%`;
        let min = Math.floor(currentTime / 60);
        let sec = Math.floor(currentTime % 60);
        currentTimeEl.innerText = `0${min}:${sec < 10 ? '0' + sec : sec}`;
    });
    
    // 进度条点击跳转
    progressContainer.addEventListener('click', (e) => {
        if (audio.duration) {
            audio.currentTime = (e.offsetX / progressContainer.clientWidth) * audio.duration;
        }
    });
    
    // 歌曲结束自动播放下一首
    audio.addEventListener('ended', () => {
        if (window.backgroundMusic) {
            window.backgroundMusic.nextTrack();
            updateUI();
        }
    });

    // 鼠标滚轮切换
    playlistEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (isScrolling || !window.backgroundMusic) return;
        isScrolling = true;
        
        const direction = e.deltaY > 0 ? 1 : -1;
        window.backgroundMusic.loadTrack(currentTrackIndex + direction);
        updateUI();
        
        setTimeout(() => { isScrolling = false; }, 200);
    });
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', () => {
    // 初始化播放列表
    initPlaylistDOM();
    
    // 等待backgroundMusic加载完成
    waitForBackgroundMusic();
});

</script>
</body>
</html>
